<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Snake Game</title>

    <style>

        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            background: white;

        }


        body {

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: monospace;

        }


        #game {

            font-family: monospace;

            font-size: 16px;

            line-height: 1;

            white-space: pre;

            width: 50ch;

            height: 20em;

            display: flex;

            justify-content: center;

            align-items: center;

            user-select: none;

        }


        #screen {

            white-space: pre;

            font-family: monospace;

            font-size: 16px;

            line-height: 1;

            width: 50ch;

            height: 20em;

            margin: 0;

            padding: 0;

        }

    </style>

</head>


<body>

    <div id="game">

        <pre id="screen"></pre>

    </div>


<script>


/*
 * Get the game screen element.
 */

const screen = document.getElementById("screen");


/*
 * Send a key to Flask.
 */

function sendKey(key) {

    fetch("/key", {

        method: "POST",

        headers: {

            "Content-Type": "application/json"

        },

        body: JSON.stringify({

            key: key

        })

    });

}


/*
 * Keyboard controls.
 */

document.addEventListener("keydown", function(event) {


    /*
     * Up.
     */

    if (event.key === "ArrowUp") {

        event.preventDefault();

        sendKey("UP");

    }


    /*
     * Down.
     */

    else if (event.key === "ArrowDown") {

        event.preventDefault();

        sendKey("DOWN");

    }


    /*
     * Left.
     */

    else if (event.key === "ArrowLeft") {

        event.preventDefault();

        sendKey("LEFT");

    }


    /*
     * Right.
     */

    else if (event.key === "ArrowRight") {

        event.preventDefault();

        sendKey("RIGHT");

    }


    /*
     * Space.
     */

    else if (event.code === "Space") {

        event.preventDefault();

        sendKey("SPACE");

    }


    /*
     * Ctrl+C.
     *
     * Browsers normally use Ctrl+C for copying.
     * Prevent the browser's normal action and send
     * the command to the Python game instead.
     */

    else if (
        event.ctrlKey &&
        event.key.toLowerCase() === "c"
    ) {

        event.preventDefault();

        sendKey("CTRL_C");

    }

});


/*
 * Connect to the Python screen stream.
 */

const stream = new EventSource("/screen");


/*
 * Receive a new screen from Python.
 */

stream.onmessage = function(event) {


    /*
     * Flask sends the Python screen with
     * newline characters escaped for SSE.
     */

    const text = event.data.replace(
        /\\n/g,
        "\n"
    );


    /*
     * Display exactly what Python generated.
     */

    screen.textContent = text;

};


/*
 * Session expiration.
 *
 * Flask sends this event when the server removes
 * an abandoned session.
 */

stream.addEventListener("expired", function() {

    /*
     * EventSource normally reconnects automatically.
     *
     * Close it so an abandoned session does not
     * immediately create another connection.
     */

    stream.close();

});


</script>

</body>

</html>
